<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>COMMIT · verification harness</title>
<style>
body{background:#07090f;color:#e9edf4;font-family:ui-monospace,Menlo,Consolas,monospace;margin:16px;display:flex;gap:16px;align-items:flex-start}
#out{white-space:pre-wrap;font-size:12px;line-height:1.7;max-width:640px}
#out .fail{color:#ff5d5d}
iframe{width:480px;height:800px;border:1px solid #26304a;flex:none}
h1{font-size:14px;letter-spacing:.1em;margin:0 0 8px}
</style>
</head>
<body>
<div><h1>COMMIT · VERIFICATION (v6 · six towers)</h1><div id="out">running…</div></div>
<iframe id="f" src="index.html"></iframe>
<script>
"use strict";
const out = document.getElementById("out");
let passN = 0, failN = 0;
const lines = [];
function ok(name, cond, extra) {
  const line = (cond ? "PASS" : "FAIL") + " · " + name + (extra ? " · " + extra : "");
  lines.push(line);
  cond ? passN++ : failN++;
  out.innerHTML = lines.map(l => l.startsWith("FAIL") ? '<span class="fail">' + l + "</span>" : l).join("\n")
    + "\n\nSUMMARY: " + passN + " passed, " + failN + " failed";
  document.title = failN ? "FAIL " + failN : "ALL PASS " + passN;
}
function ptr(w, d, type, x, y, id) {
  const cv = d.getElementById("cv"), r = cv.getBoundingClientRect();
  cv.dispatchEvent(new w.PointerEvent(type, {
    pointerId: id == null ? 1 : id,
    clientX: r.left + x, clientY: r.top + y,
    bubbles: true, cancelable: true
  }));
}
function key(w, k, shift) { w.dispatchEvent(new w.KeyboardEvent("keydown", { key: k, shiftKey: !!shift, bubbles: true, cancelable: true })); }
function keyup(w, k, shift) { w.dispatchEvent(new w.KeyboardEvent("keyup", { key: k, shiftKey: !!shift, bubbles: true, cancelable: true })); }

/* raw descriptor rect at world time t (movers resolved through the real moverXY) */
function rectAt(C, p, t) {
  if (p[3] === C.C.PLAT_MOVE_H || p[3] === C.C.PLAT_MOVE_V || p[3] === C.C.PLAT_ORBIT) {
    const plat = C.PLATS[C.RAW_PLATS.indexOf(p)];
    const pos = C.moverXY(plat, t);
    return [pos.x, pos.y + C.C.PLATFORM_HEIGHT, p[2]];
  }
  return p;
}

/* Phase-aware jump search. fi/ti are platform indices (-1 = floor / goal). When a mover is involved,
   sample launch phases over its period and demand a ±SOLVER_PHASE_TOL window still lands (not frame-perfect).
   warpDest: search a launch onto pad `ti` whose fold opens on rest `warpDest` (the mark rings the
   destination, so acceptance + range use that rect). */
function findLaunch(C, fi, ti, warpDest) {
  const charSize = C.C.CHAR_SIZE, maxV = C.C.MAX_LAUNCH_SPEED, grav = C.C.GRAVITY;
  const fp = fi < 0 ? [0, 0, C.C.VIEW_W, 0] : C.RAW_PLATS[fi];
  const tp = ti < 0 ? [C.GOAL.x, C.C.SUMMIT, C.GOAL.w, 0, true] : C.RAW_PLATS[ti];
  const accept = warpDest == null ? ti : warpDest;
  const rp = warpDest == null ? tp : C.RAW_PLATS[warpDest];
  const fm = fp[3] === C.C.PLAT_MOVE_H || fp[3] === C.C.PLAT_MOVE_V || fp[3] === C.C.PLAT_CLOCK || fp[3] === C.C.PLAT_ORBIT;
  const tm = tp[3] === C.C.PLAT_MOVE_H || tp[3] === C.C.PLAT_MOVE_V || tp[3] === C.C.PLAT_CLOCK || tp[3] === C.C.PLAT_ORBIT;
  const per = fm ? (fp[5] || C.C.MOVER_DEFAULT_PERIOD) : tm ? (tp[5] || C.C.MOVER_DEFAULT_PERIOD) : 0;
  const phases = per ? [0, per * 0.25, per * 0.5, per * 0.75, per * 0.125, per * 0.375, per * 0.625, per * 0.875] : [0];
  const spring = C.RAW_PLATS.some(p => (p[3] === C.C.PLAT_BOUNCE || (p[3] === C.C.PLAT_DIR && p[5] > 0)) && p[1] > fp[1] && p[1] < tp[1]);
  const zone = C.ZONES.some(z => z.y < tp[1] + 40 && z.y + z.h > fp[1] - 40 && z.x + z.w > Math.min(fp[0], tp[0]) && z.x < Math.max(fp[0] + fp[2], tp[0] + tp[2]));
  for (const ph of phases) {
    C.setWorldT(ph);
    const fr = rectAt(C, fp, ph), tr = rectAt(C, tp, ph), rr = rectAt(C, rp, ph);
    /* prune only direct jumps: a spring or a descending lift can do the lifting */
    const dyLo = ((tp[3] === C.C.PLAT_MOVE_V || tp[3] === C.C.PLAT_ORBIT) ? tp[1] - (tp[4] || C.C.MOVER_DEFAULT_AMP) : tr[1])
      - ((fp[3] === C.C.PLAT_MOVE_V || fp[3] === C.C.PLAT_ORBIT) ? fp[1] + (fp[4] || C.C.MOVER_DEFAULT_AMP) : fr[1]);
    const vyNeed = (spring || zone) ? 0 : Math.sqrt(2 * grav * Math.max(0, dyLo));
    const xs = [fr[0] + fr[2] / 2 - charSize / 2, fr[0] + 1, fr[0] + fr[2] - charSize - 1];
    for (const bx of xs) {
      C.setBody(bx, fr[1]);
      const tc = tr[0] + tr[2] / 2, bc = bx + charSize / 2;
      const lo = tc >= bc ? C.C.SOLVER_ANGLE_MIN : C.C.SOLVER_ANGLE_UP;
      const hi = tc >= bc ? C.C.SOLVER_ANGLE_UP : C.C.SOLVER_ANGLE_MAX;
      for (let ang = lo; ang <= hi; ang += C.C.SOLVER_ANGLE_STEP) {
        const rad = ang * Math.PI / 180, sin = Math.sin(rad);
        if (sin * C.C.SOLVER_MAX_POWER * maxV < vyNeed) continue;
        const pw0 = Math.max(C.C.SOLVER_MIN_POWER, Math.ceil(vyNeed / (sin * maxV) / C.C.SOLVER_POWER_STEP) * C.C.SOLVER_POWER_STEP);
        for (let pw = pw0; pw <= C.C.SOLVER_MAX_POWER + 0.001; pw += C.C.SOLVER_POWER_STEP) {
          const vx = Math.cos(rad) * pw * maxV, vy = sin * pw * maxV;
          const pr = C.preview({ x: vx, y: vy });
          if (pr.mark && pr.mark.ok && (ti < 0 ? pr.mark.goal : pr.mark.idx === accept) && pr.mark.x > rr[0] - charSize / 2 && pr.mark.x < rr[0] + rr[2] + charSize / 2) {
            if (per) {
              let tol = true;
              for (const d of [-C.C.SOLVER_PHASE_TOL, C.C.SOLVER_PHASE_TOL]) {
                C.setWorldT(ph + d);
                const tr2 = rectAt(C, rp, ph + d);
                const p2 = C.preview({ x: vx, y: vy });
                if (!(p2.mark && p2.mark.ok && (ti < 0 ? p2.mark.goal : p2.mark.idx === accept) && p2.mark.x > tr2[0] - charSize / 2 && p2.mark.x < tr2[0] + tr2[2] + charSize / 2)) tol = false;
              }
              C.setWorldT(ph);
              if (!tol) continue;
            }
            return { bx, vx, vy, contacts: pr.contacts, ph };
          }
        }
      }
    }
  }
  return null;
}

/* every rest-to-rest jump (bounce pads, dir springs and warp doors are not rests) must solve
   at ≤98% power — directly, or by folding through a door whose target is the next rest */
function solveTower(C, label) {
  const restIdx = [];
  C.RAW_PLATS.forEach((p, i) => { if (p[3] !== C.C.PLAT_BOUNCE && p[3] !== C.C.PLAT_DIR && p[3] !== C.C.PLAT_WARP) restIdx.push(i); });
  const n = restIdx.length + 1;
  let solved = 0, maxPw = 0;
  const fails = [];
  for (let i = 0; i < n; i++) {
    const fi = i === 0 ? -1 : restIdx[i - 1];
    const ti = i < restIdx.length ? restIdx[i] : -1;
    const via = C.RAW_PLATS.findIndex(p => p[3] === C.C.PLAT_WARP && p[4] === ti);
    const sol = findLaunch(C, fi, ti) || (via >= 0 ? findLaunch(C, fi, via, ti) : null);
    if (sol) {
      solved++;
      maxPw = Math.max(maxPw, Math.round(Math.hypot(sol.vx, sol.vy) / C.C.MAX_LAUNCH_SPEED * 100));
    } else fails.push("jump" + (i + 1));
  }
  ok(label + ": all " + n + " jumps solvable at ≤98% power", fails.length === 0,
    "solved " + solved + "/" + n + " · hardest " + maxPw + "%" + (fails.length ? " · UNSOLVED: " + fails.join(",") : ""));
  return fails.length === 0;
}

async function main() {
  const f = document.getElementById("f");
  await new Promise(r => {
    if (f.contentWindow && f.contentDocument && f.contentDocument.readyState === "complete" && f.contentWindow.__COMMIT__) r();
    else f.addEventListener("load", r, { once: true });
  });
  const w = f.contentWindow, d = f.contentDocument;
  if (!w.__COMMIT__) { ok("game hook present", false, "iframe blocked? serve over HTTP"); return; }
  const C = w.__COMMIT__;
  const errs = [];
  w.addEventListener("error", e => errs.push(String(e.message)));
  C.takeControl();
  let now = w.performance.now();
  const tick = ms => { now += ms; C.tick(now); };
  const settle = () => { let n = 0; while (C.state === "flight" && n < 2000) { tick(1000 / 60); n++; } return n; };
  const RM = C.RM;

  /* 1 · boot: main menu is the start page */
  ok("boot: main menu is the start page", C.overlayOpen === "menu" && !d.getElementById("menu").hidden);
  ok("boot: menu offers START GAME on a fresh run", d.getElementById("bContinue").textContent === "START GAME");
  ok("boot: ready at 0m on tower 1", C.state === "ready" && C.body.y === 0 && C.level === 1);
  ok("tower 2 locked at start", C.life.unlocked === 1);
  C.setLevel(2);
  ok("locked tower cannot be entered", C.level === 1);
  d.getElementById("bContinue").click();
  ok("boot: START GAME closes menu", C.overlayOpen === null);
  for (let i = 0; i < 150; i++) tick(16.7);
  ok("idle hint arms after 2.2s", C.idleT > C.C.IDLE_HINT_DELAY);

  /* 2 · weak drag cancels */
  ptr(w, d, "pointerdown", 240, 600);
  ok("pointerdown starts aim + fuse", C.state === "aim" && C.aim && C.aim.mode === "p" && C.aimT === C.C.AIM_FUSE_TIME);
  ptr(w, d, "pointermove", 245, 595);
  ptr(w, d, "pointerup", 245, 595);
  ok("weak drag (<90px/s) cancels, no launch", C.state === "ready" && C.run.launches === 0);

  /* 3 · commit contract */
  ptr(w, d, "pointerdown", 240, 600);
  ptr(w, d, "pointermove", 340, 500);
  const kv = C.C.DRAG_SPEED_PER_PX;
  const pr = C.preview({ x: 100 * kv, y: 100 * kv });
  ok("preview yields arc + landing mark", pr.pts.length > 10 && pr.mark && pr.mark.ok);
  ptr(w, d, "pointerup", 340, 500);
  ok("release above threshold commits", C.state === "flight" && C.run.launches === 1);
  settle();
  ok("preview contacts ≡ flight contacts (pixel-exact)", JSON.stringify(C.flightContacts) === JSON.stringify(pr.contacts));
  ok("trail lingers after landing", C.trail.length > 0);

  /* 4 · off-canvas release */
  ptr(w, d, "pointerdown", 240, 600);
  ptr(w, d, "pointermove", 700, 300);
  ptr(w, d, "pointerup", 700, 300);
  ok("off-canvas release still commits", C.state === "flight" && C.run.launches === 2);
  settle();

  /* 5 · aim fuse */
  C.resetRun();
  ptr(w, d, "pointerdown", 240, 600);
  ptr(w, d, "pointermove", 340, 500);
  for (let i = 0; i < 230; i++) tick(16.7);
  ok("aim fuse auto-launches on expiry", C.run.launches === 1 && C.state !== "aim");
  settle();
  C.resetRun();
  ptr(w, d, "pointerdown", 240, 600);
  for (let i = 0; i < 230; i++) tick(16.7);
  ok("weak fuse cancels without launch", C.state === "ready" && C.run.launches === 0);
  ptr(w, d, "pointerup", 240, 600);

  /* 6 · ceiling bonk */
  C.setBody(176, 2280);
  const prb = C.preview({ x: 60, y: 830 });
  ok("steep arc under ceiling previews red ✕", prb.mark && !prb.mark.ok);
  C.launch({ x: 60, y: 830 });
  settle();
  ok("bonk contact pixel-exact, then honest fall",
    C.flightContact && C.flightContact.t === "bonk" && C.flightContact.x === prb.mark.x && C.flightContact.y === prb.mark.y && C.state === "ready");

  /* 7 · crumble + reform */
  C.resetRun();
  const cr = C.RAW_PLATS[8];
  C.setBody(cr[0] + cr[2] / 2 - C.C.CHAR_SIZE / 2, cr[1]);
  ok("standing on a crumble platform", !!C.body.on && C.body.on.crumble === true);
  for (let i = 0; i < 110; i++) tick(16.7);
  ok("crumble breaks after dwell + recorded", C.PLATS[8].dead === true && C.run.dead.indexOf(8) >= 0);
  ok("break spawns shards + drops you", C.shards.length > 0 && C.body.y < cr[1]);
  settle();
  ok("crumble fall lands you below", C.state === "ready" && C.body.y < cr[1]);
  for (let i = 0; i < 230; i++) tick(16.7);
  ok("crumble reforms after cooldown (no softlock)", C.PLATS[8].dead === false && C.run.dead.indexOf(8) < 0);
  C.resetRun();
  ok("reset rebuilds crumbled platforms", C.PLATS[8].dead === false && C.run.dead.length === 0);
  C.setBody(cr[0] + cr[2] / 2 - C.C.CHAR_SIZE / 2, cr[1]);
  C.launch({ x: 0, y: 400 });
  settle();
  ok("launching before dwell keeps platform intact", C.PLATS[8].dead === false);

  /* 8 · bounce chain */
  C.resetRun();
  const restA = [140, 2490, 80, 0], restC = [400, 2720, 72, 0];
  const bs = findLaunch(C, 17, 19);
  ok("bounce chain is solvable", !!bs);
  if (bs) {
    ok("bounce chain arc previews a bounce hop", bs.contacts.some(c => c.t === "bounce"));
    C.setBody(bs.bx, restA[1]);
    const prc = C.preview({ x: bs.vx, y: bs.vy });
    C.launch({ x: bs.vx, y: bs.vy });
    settle();
    ok("bounce flight contacts ≡ preview (pixel-exact)", JSON.stringify(C.flightContacts) === JSON.stringify(prc.contacts));
    ok("bounce chain ends grounded on target", C.state === "ready" && Math.abs(C.body.y - restC[1]) < 1);
    ok("direct A→C impossible (spring required)", restC[1] - restA[1] > C.C.MAX_LAUNCH_SPEED * C.C.MAX_LAUNCH_SPEED / (2 * C.C.GRAVITY));
  }

  /* 9 · fall economy */
  C.resetRun();
  const fallsBefore = C.run.falls;
  C.setBody(430, 1680);
  C.launch({ x: 200, y: 300 });
  settle();
  const shake9 = C.shake;
  ok("wall hit converts to straight drop, lands on floor", C.flightContact.t === "wall" && C.body.y === 0);
  ok("fall ≥25m counted once + biggest drop", C.run.falls === fallsBefore + 1 && C.run.biggest >= 1680);
  ok("fall flash + −Xm popup fired", C.flash > 0 && C.floats.length >= 1);
  ok(RM ? "reduced motion: shake suppressed" : "hard landing shakes screen", RM ? shake9 === 0 : shake9 > 0);

  /* 10 · keyboard FSM (hold-to-sweep) */
  C.resetRun();
  key(w, "ArrowUp");
  ok("arrow raises keyboard aim", C.state === "aim" && C.aim && C.aim.mode === "k");
  const p0 = C.kb.power, a0 = C.kb.angle;
  for (let i = 0; i < 6; i++) tick(16.7);
  keyup(w, "ArrowUp");
  ok("holding an arrow sweeps power continuously", Math.abs(C.kb.power - p0 - C.C.KB_POWER_RATE * 0.1002) < 0.005 && C.kb.power > p0);
  key(w, "ArrowLeft", true);
  for (let i = 0; i < 6; i++) tick(16.7);
  keyup(w, "ArrowLeft", false);
  ok("shift = quarter-rate fine sweep", Math.abs(C.kb.angle - a0 - C.C.KB_ANGLE_RATE * C.C.KB_FINE_FACTOR * 0.1002) < 0.2);
  const at0 = C.aimT;
  key(w, "ArrowRight");
  for (let i = 0; i < 6; i++) tick(16.7);
  keyup(w, "ArrowRight");
  ok("arrows while aiming do not reset the fuse", C.aimT < at0 - 0.05);
  key(w, "Escape");
  ok("esc pauses without cancelling the drawn aim", C.overlayOpen === "pause" && C.state === "aim" && C.aim && C.aim.mode === "k");
  key(w, "Escape");
  ok("esc resumes the preserved aim", C.overlayOpen === null && C.state === "aim");
  key(w, " ");
  ok("space commits the standing aim", C.state === "flight" && C.run.launches === 1);
  settle();
  ok("full power reachable within a 210px drag", C.C.MAX_LAUNCH_SPEED / C.C.DRAG_SPEED_PER_PX <= 210,
    "full-power drag " + Math.round(C.C.MAX_LAUNCH_SPEED / C.C.DRAG_SPEED_PER_PX) + "px");

  /* 11 · overlays pause */
  const t0 = C.run.time;
  key(w, "h");
  ok("H opens help", C.overlayOpen === "help");
  for (let i = 0; i < 60; i++) tick(16.7);
  ok("timer frozen while overlay open", C.run.time === t0);
  key(w, "Escape");
  ok("esc closes help", C.overlayOpen === null);
  key(w, "r");
  ok("R opens erase confirm", C.overlayOpen === "confirm");
  d.getElementById("bNo").click();
  ok("keep climbing dismisses confirm", C.overlayOpen === null && C.run.launches === 1);

  /* 12 · persistence v3 */
  const sp = { x: C.safePos.x, y: C.safePos.y };
  const stored = JSON.parse(w.localStorage.getItem("commit.v3"));
  ok("landing persists grounded pos + stats (v3)", stored.runs[1].x === sp.x && stored.runs[1].y === sp.y && stored.runs[1].launches === C.run.launches);
  C.body.x = 100;
  C.body.y = 3000;
  C.save();
  const stored2 = JSON.parse(w.localStorage.getItem("commit.v3"));
  ok("airborne position never persisted", stored2.runs[1].x === sp.x && stored2.runs[1].y === sp.y);
  C.load();
  ok("resume returns to last grounded spot", C.body.x === sp.x && C.body.y === sp.y);
  w.localStorage.setItem("commit.v3", JSON.stringify({ level: 1, runs: { 1: { x: 9999, y: -5, launches: -3, time: "x", dead: [999, -1, "a"] } }, life: { best: { 1: -1 }, summits: { 1: -2 }, bestTime: { 1: -5 } } }));
  C.load();
  ok("corrupt v3 save sanitized", C.body.y >= 0 && C.run.launches >= 0 && C.life.best[1] >= 0 && C.life.summits[1] >= 0 && C.life.bestTime[1] === null && C.run.dead.length === 0);
  w.localStorage.setItem("commit.v3", JSON.stringify(stored));
  C.load();

  /* 13 · erase keeps lifetime */
  const bestBefore = C.life.best[1];
  ok("lifetime best recorded", bestBefore > 0);
  d.getElementById("bReset").click();
  ok("↺ asks confirmation", C.overlayOpen === "confirm");
  d.getElementById("bYes").click();
  ok("erase zeroes run, lifetime survives", C.run.launches === 0 && C.run.falls === 0 && C.run.time === 0 && C.body.y === 0 && C.life.best[1] === bestBefore && C.overlayOpen === null);

  /* 14 · multi-pointer + caps */
  ptr(w, d, "pointerdown", 100, 500, 1);
  ptr(w, d, "pointerdown", 300, 400, 2);
  ok("only first pointer aims", C.aim && C.aim.id === 1 && C.aim.ox === 100);
  ptr(w, d, "pointermove", 320, 420, 2);
  ok("second pointer move ignored", C.aim.cx === 100 && C.aim.cy === 500);
  ptr(w, d, "pointerup", 320, 420, 2);
  ok("second pointer release ignored", C.state === "aim");
  ptr(w, d, "pointercancel", 100, 500, 1);
  ok("pointercancel cancels aim", C.state === "ready" && C.aim === null);
  for (let i = 0; i < 80; i++) C.spawnDust(240, 100, 16, "#ffffff");
  ok("dust particle cap holds (≤300)", C.parts.length <= C.C.PARTS_MAX);

  /* 15 · storage disabled */
  const oSet = w.localStorage.setItem.bind(w.localStorage), oGet = w.localStorage.getItem.bind(w.localStorage);
  w.localStorage.setItem = () => { throw new Error("quota"); };
  w.localStorage.getItem = () => { throw new Error("denied"); };
  let threw = false;
  try { C.save(); C.load(); } catch (e) { threw = true; }
  ok("storage failure is silent (private mode)", !threw);
  w.localStorage.setItem = oSet;
  w.localStorage.getItem = oGet;

  /* 16 · hidden tab */
  let hiddenFlag = false;
  Object.defineProperty(d, "hidden", { configurable: true, get: () => hiddenFlag });
  C.launch({ x: 0, y: 300 });
  settle();
  const tt = C.run.time;
  hiddenFlag = true;
  d.dispatchEvent(new w.Event("visibilitychange"));
  for (let i = 0; i < 60; i++) tick(16.7);
  ok("hidden tab freezes timer", C.run.time === tt);
  hiddenFlag = false;
  d.dispatchEvent(new w.Event("visibilitychange"));
  now = w.performance.now();
  tick(16.7);
  ok("return resumes without time jump", C.run.time >= tt && C.run.time < tt + 1);

  /* 17 · sound */
  ok("audio context exists after gestures", !!C.snd.ctx);
  ok("sound on by default", C.snd.on === true);
  const bS = d.getElementById("bSound");
  bS.click();
  ok("♪ button mutes + persists + shows state", C.snd.on === false && bS.getAttribute("aria-pressed") === "false" && w.localStorage.getItem("commit.snd") === "false" && bS.classList.contains("off"));
  key(w, "m");
  ok("M unmutes + persists", C.snd.on === true && w.localStorage.getItem("commit.snd") === "true" && bS.getAttribute("aria-pressed") === "true");

  /* 18 · altitude palette */
  const s0 = C.skyAt(0)[0], s1 = C.skyAt(1)[0];
  const skyDist = Math.abs(s0[0] - s1[0]) + Math.abs(s0[1] - s1[1]) + Math.abs(s0[2] - s1[2]);
  ok("sky palette differs floor vs summit", skyDist > 60, "Δrgb=" + Math.round(skyDist));

  /* 19 · summit + unlock */
  C.resetRun();
  C.setBody(339, 4980);
  const prw = C.preview({ x: -200, y: 760 });
  ok("final jump previews goal landing", prw.mark && prw.mark.ok && prw.mark.goal);
  const summitsBefore = C.life.summits[1] || 0;
  C.launch({ x: -200, y: 760 });
  settle();
  ok("landing on summit wins", C.state === "win" && C.overlayOpen === "win" && !d.getElementById("win").hidden);
  ok("win stats + share text populated", d.getElementById("wTime").textContent !== "—" && d.getElementById("share").value.indexOf("508m") >= 0 && d.getElementById("share").value.indexOf("TOWER 1") >= 0);
  ok("lifetime summits increment", C.life.summits[1] === summitsBefore + 1);
  ok("summit unlocks tower 2 + NEXT shown", C.life.unlocked === 2 && !d.getElementById("bNext").hidden && !d.getElementById("winUnlock").hidden);
  ok(RM ? "reduced motion: confetti skipped" : "confetti fires (90)", RM ? C.confetti.length === 0 : C.confetti.length === C.C.CONFETTI_COUNT);
  ok("best time recorded", C.life.bestTime[1] != null && C.life.bestTime[1] >= 0);

  /* 20 · climb again */
  d.getElementById("bAgain").click();

  ok("T5 summit wins", C.state === "win" && C.life.summits[5] === sb5 + 1);
  ok("T5 share text uses 676m", d.getElementById("share").value.indexOf("676m") >= 0);
  ok("T5 summit unlocks tower 6 + NEXT shown", C.life.unlocked === 6 && !d.getElementById("bNext").hidden);
  C.closeOv();
  C.resetRun();

  /* 35 · phase ticks are diegetic (local), not a global metronome */
  C.setLevel(4);
  C.resetRun();
  const origSfx = w.sfx;
  let phaseCalls = 0;
  w.sfx = function (n, o) { if (n === "phase") phaseCalls++; return origSfx(n, o); };
  C.setWorldT(0);
  C.setBody(240, 0);
  for (let i = 0; i < 240; i++) tick(16.7);
  ok("off-screen phase toggles are silent", phaseCalls === 0, "calls=" + phaseCalls);
  phaseCalls = 0;
  const phP = C.RAW_PLATS[11];
  C.setWorldT(0);
  C.setBody(phP[0] + phP[2] / 2 - C.C.CHAR_SIZE / 2, phP[1]);
  for (let i = 0; i < 240; i++) tick(16.7);
  ok("underfoot/near phase toggles tick", phaseCalls > 0, "calls=" + phaseCalls);
  w.sfx = origSfx;
  C.resetRun();

  /* 36 · tower 6 (one-way warp pads): the fold obeys the Commit Contract */
  C.setLevel(6);
  ok("switch to tower 6 (780m)", C.level === 6 && C.C.SUMMIT === 7800);
  ok("T6 has warp pads", C.RAW_PLATS.some(p => p[3] === C.C.PLAT_WARP));
  C.resetRun();
  const wj = findLaunch(C, 3, 4, 5);
  ok("first door solvable (jump onto pad, fold up)", !!wj);
  if (wj) {
    C.setWorldT(wj.ph);
    C.setBody(wj.bx, C.RAW_PLATS[3][1]);
    const pw = C.preview({ x: wj.vx, y: wj.vy });
    ok("fold mark carries destination + source (contract data; render hides it)", !!pw.mark && pw.mark.ok && pw.mark.idx === 5 && pw.mark.warp === 4);
    C.launch({ x: wj.vx, y: wj.vy });
    settle();
    ok("warp flight contacts ≡ preview (pixel-exact)", JSON.stringify(C.flightContacts) === JSON.stringify(pw.contacts));
    ok("landing on the pad folds you to the target rest", C.state === "ready" && C.body.on && C.body.on.idx === 5 && C.body.y === C.RAW_PLATS[5][1]);
    ok("warp arrival stands still (momentum discarded)", C.body.vx === 0 && C.body.slide === 0);
    ok("warp glow + shake fired", C.warpGlow > 0 && (RM ? C.shake === 0 : C.shake > 0));
    ok("warp sparks burst in pink", C.parts.some(p => p.c === "#ff6ec7"));
    C.save();
    const stW = JSON.parse(w.localStorage.getItem("commit.v3"));
    ok("fold destination persisted", stW.runs[6].y === C.RAW_PLATS[5][1]);
    C.load();
    ok("resume stands on the fold destination", C.body.on && C.body.on.idx === 5);
  }
  C.resetRun();
  const pad = C.RAW_PLATS[4];
  C.setBody(pad[0] - 60, pad[1] - 8);
  C.launch({ x: 300, y: 0 });
  settle();
  ok("side hit on a door is a wall, not a warp", C.flightContact.t === "wall" && !C.flightContacts.some(c => c.warp >= 0));
  C.resetRun();
  C.setBody(pad[0] + pad[2] / 2 - C.C.CHAR_SIZE / 2, pad[1] - 80);
  C.launch({ x: 0, y: 500 });
  settle();
  ok("bonk under a door is a bonk, not a warp", C.flightContact.t === "bonk" && !C.flightContacts.some(c => c.warp >= 0));
  C.resetRun();
  const tj = findLaunch(C, 6, 7, 1);
  ok("trap door reachable (looks like progress)", !!tj);
  if (tj) {
    const fBefore = C.run.falls;
    C.setWorldT(tj.ph);
    C.setBody(tj.bx, C.RAW_PLATS[6][1]);
    C.launch({ x: tj.vx, y: tj.vy });
    settle();
    ok("trap door folds you back down the tower", C.body.on && C.body.on.idx === 1 && C.body.y === C.RAW_PLATS[1][1]);
    ok("unkind fold counts as a fall (honest economy)", C.run.falls === fBefore + 1 && C.flash > 0);
  }
  C.resetRun();
  ok("direct rise past the ice shelf impossible", findLaunch(C, 6, 9) === null);
  const dj6 = findLaunch(C, 6, 8, 9);
  ok("jump DOWN onto the door solves the gap", !!dj6);
  if (dj6) {
    C.setWorldT(dj6.ph);
    C.setBody(dj6.bx, C.RAW_PLATS[6][1]);
    const pd6 = C.preview({ x: dj6.vx, y: dj6.vy });
    C.launch({ x: dj6.vx, y: dj6.vy });
    settle();
    ok("down-jump fold contacts ≡ preview", JSON.stringify(C.flightContacts) === JSON.stringify(pd6.contacts));
    ok("down-jump fold lands on the high rest", C.body.on && C.body.on.idx === 9);
  }
  C.resetRun();
  const qj = findLaunch(C, 3, 4, 5);
  if (qj) {
    C.setWorldT(qj.ph);
    C.setBody(qj.bx, C.RAW_PLATS[3][1]);
    C.launch({ x: qj.vx, y: qj.vy });
    tick(50);
    ptr(w, d, "pointerdown", 240, 600);
    ptr(w, d, "pointermove", 300, 450);
    ptr(w, d, "pointerup", 300, 450);
    ok("mid-flight queue arms before the fold", !!C.pendingV && C.state === "flight");
    const lQ = C.run.launches;
    settle();
    ok("queued commit fires from the fold destination", C.run.launches === lQ + 1 && C.pendingV === null);
    settle();
  }
  C.resetRun();

  /* 37 · tower 6 solver + summit */
  solveTower(C, "T6");
  C.resetRun();
  const fin6 = findLaunch(C, 45, -1);
  ok("T6 final jump previews goal", !!fin6 && fin6.contacts[fin6.contacts.length - 1].goal);
  const sb6 = C.life.summits[6] || 0;
  if (fin6) {
    C.setWorldT(fin6.ph);
    C.setBody(fin6.bx, C.RAW_PLATS[45][1]);
    C.launch({ x: fin6.vx, y: fin6.vy });
  }
  settle();
  ok("T6 summit wins", C.state === "win" && C.life.summits[6] === sb6 + 1);
  ok("T6 share text uses 780m", d.getElementById("share").value.indexOf("780m") >= 0);
  ok("last tower hides NEXT", d.getElementById("bNext").hidden);
  ok("tower 6 is the last unlock", C.life.unlocked === 6);
  C.closeOv();
  C.resetRun();

  /* 38 · dead-vertical spring landing escapes (no infinite bounce) */
  C.setLevel(1);
  C.resetRun();
  const bp = C.RAW_PLATS[18];
  C.setBody(bp[0] + bp[2] / 2 - C.C.CHAR_SIZE / 2, bp[1] + 250);
  const pvB = C.preview({ x: 0, y: 0 });
  ok("straight drop onto a spring previews the hop", pvB.contacts.some(c => c.t === "bounce"));
  C.launch({ x: 0, y: 0 });
  settle();
  ok("vertical spring flight ≡ preview (nudge is in step)", JSON.stringify(C.flightContacts) === JSON.stringify(pvB.contacts));
  ok("dead-vertical bounce escapes the pad (not stuck)", C.state === "ready" && C.body.on !== C.PLATS[18] && C.bounceChain <= 3,
    "chain=" + C.bounceChain + " on=" + (C.body.on && C.body.on.idx));
  ok("escape nudge moved the square sideways", Math.abs(C.body.x - (bp[0] + bp[2] / 2 - C.C.CHAR_SIZE / 2)) > 20);
  C.resetRun();

  /* 39 · reset is reachable from pause (no keyboard-only actions) */
  C.launch({ x: 0, y: 300 });
  settle();
  key(w, "Escape");
  ok("pause offers RESET RUN", !d.getElementById("bPauseReset").hidden && C.overlayOpen === "pause");
  d.getElementById("bPauseReset").click();
  ok("pause RESET RUN asks confirmation", C.overlayOpen === "confirm");
  d.getElementById("bNo").click();
  ok("keep climbing returns to pause", C.overlayOpen === "pause");
  d.getElementById("bPauseReset").click();
  d.getElementById("bYes").click();
  ok("erase from pause zeroes the run", C.run.launches === 0 && C.body.y === 0 && C.overlayOpen === null);
  C.resetRun();

  ok("no runtime errors during suite", errs.length === 0, errs.join(" | "));
  out.innerHTML += "\n\n" + (RM ? "MODE: prefers-reduced-motion" : "MODE: standard") + " · DONE";
}
main().catch(e => ok("harness crashed", false, String(e && e.stack || e)));
</script>
</body>
</html>
