# Publish ONLY the game to GitHub Pages. The level editor (editor.html, js/editor.js)
# is committed to the repo for development but deliberately excluded from this whitelist.
name: Deploy Pages (game only)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble game-only publish dir
        run: |
          mkdir -p public/js
          cp index.html style.css test.html public/
          cp -r levels public/
          for f in js/*.js; do
            if [ "$f" != "js/editor.js" ]; then cp "$f" public/js/; fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4